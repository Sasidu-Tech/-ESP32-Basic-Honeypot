
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Honeypot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        .card {
            background: #1e293b;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 50px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .warning {
            color: #facc15;
            font-size: 18px;
            margin: 20px 0;
        }

        .status {
            display: inline-block;
            background: #166534;
            color: #bbf7d0;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        .info {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="icon">🍯</div>

            <h1>ESP32 HONEYPOT</h1>

            <div class="warning">
                ⚠️ This is a monitored device
            </div>

            <div class="status">
                ● Status: ONLINE
            </div>

            <div class="info">
                ESP32 Basic Honeypot Security System
            </div>

        </div>

    </div>

</body>
</html>
